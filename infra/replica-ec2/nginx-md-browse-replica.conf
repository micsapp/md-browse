# md-browse REPLICA (mirror of md-docs.micstec.com)
# Serves the static frontend and read-only API locally on :8090.
# Mutating API requests are forwarded to the primary (md-docs.micstec.com),
# which is the single writer; backend/data/ is rsync'd back from it.
# The cloudflared "md" tunnel connector points at http://localhost:8090.

upstream md_browse_local {
    server 127.0.0.1:3001;
    keepalive 64;
}

# Reads stay local; writes go to the primary.
map $request_method $md_api_target {
    default  "https://md-docs.micstec.com";
    GET      "http://md_browse_local";
    HEAD     "http://md_browse_local";
    OPTIONS  "http://md_browse_local";
}

server {
    listen 8090;
    listen [::]:8090;
    server_name md.micstec.com md-docs.micstec.com _;

    root /home/mli/md-browse/frontend/.output/public;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    location /api {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass $md_api_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host md-docs.micstec.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Service worker must never be cached by browser/CDN
    location ~* ^/sw.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header CDN-Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header CDN-Cache-Control "no-store";
        try_files $uri $uri/ /200.html;
    }

    location / {
        try_files $uri $uri/ /200.html;
        add_header Cache-Control "no-cache";
    }

    location ~* ^(?!/api/)\S+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    client_max_body_size 10M;

    access_log /var/log/nginx/md-browse-replica-access.log;
    error_log /var/log/nginx/md-browse-replica-error.log;
}
